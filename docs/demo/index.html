<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Decant</title>
    <link rel="stylesheet" href="../../src/renderer/styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5 6h22l-8.5 11v7.5L13.5 27V17z" />
        </svg>
        <span>Decant</span>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="download" aria-selected="true"><span data-i18n="Download">Download</span></button>
        <button role="tab" data-tab="library" aria-selected="false"><span data-i18n="Library">Library</span> <span id="library-count" class="count"></span></button>
        <button role="tab" data-tab="history" aria-selected="false"><span data-i18n="History">History</span> <span id="history-count" class="count"></span></button>
        <button
          role="tab"
          class="tab-settings"
          data-tab="settings"
          aria-selected="false"
          title="Settings"
          data-i18n-title="Settings"
          aria-label="Settings"
          data-i18n-aria-label="Settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </nav>
    </header>

    <main>
      <section id="tab-download" class="tab">
        <form id="url-form" class="search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 14a3.5 3.5 0 0 0 5 0l4-4a3.5 3.5 0 0 0-5-5l-.5.5M14 10a3.5 3.5 0 0 0-5 0l-4 4a3.5 3.5 0 0 0 5 5l.5-.5" />
          </svg>
          <input
            id="url-input"
            type="text"
            spellcheck="false"
            placeholder="Paste a YouTube, Instagram, TikTok… link, or type to search"
            data-i18n-placeholder="Paste a YouTube, Instagram, TikTok… link, or type to search"
            aria-label="Link or search"
            data-i18n-aria-label="Link or search"
          />
          <button type="submit" class="btn primary" id="analyze-btn" data-i18n="Go">Go</button>
        </form>

        <div id="notice" class="notice" hidden></div>
        <div id="preview"></div>

        <div class="destination">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
          <span data-i18n="Saving to">Saving to</span>
          <button id="dest-path" class="path"></button>
          <button id="dest-change" class="btn small" data-i18n="Change">Change</button>
        </div>

        <section class="queue">
          <div class="section-head">
            <h2 data-i18n="Queue">Queue</h2>
            <button id="queue-clear" class="link" data-i18n="Clear finished" hidden>Clear finished</button>
          </div>
          <ul id="queue-list" class="rows"></ul>
          <p id="queue-empty" class="empty" data-i18n="Nothing here yet. Paste a link to get started.">Nothing here yet. Paste a link to get started.</p>
        </section>
      </section>

      <section id="tab-library" class="tab wide" hidden>
        <div class="library-head">
          <div id="library-filter" class="segmented"></div>
          <input
            id="library-search"
            type="search"
            spellcheck="false"
            placeholder="Search your library"
            data-i18n-placeholder="Search your library"
            aria-label="Search your library"
            data-i18n-aria-label="Search your library"
          />
          <button id="library-select" class="btn small" data-i18n="Select">Select</button>
        </div>
        <div id="library-selection" class="selection-bar" hidden></div>
        <ul id="library-grid" class="grid"></ul>
        <div id="library-playlist" class="playlist-view" hidden></div>
        <p id="library-empty" class="empty">Your library is empty. Choose “Save to library” on a video to watch it here, even offline.</p>
        <p id="library-usage" class="hint"></p>
      </section>

      <section id="player" class="player" hidden></section>

      <section id="tab-history" class="tab" hidden>
        <div class="section-head">
          <h2 data-i18n="History">History</h2>
          <button id="history-clear" class="link" data-i18n="Clear all">Clear all</button>
        </div>
        <ul id="history-list" class="rows"></ul>
        <p id="history-empty" class="empty" data-i18n="No downloads yet.">No downloads yet.</p>
      </section>

      <section id="tab-settings" class="tab" hidden></section>
    </main>

    <div id="mini-player" class="mini" hidden></div>

    <footer class="statusbar">
      <label
        class="cookies"
        title="For Instagram, private or age-restricted videos: Decant uses your session from this browser."
        data-i18n-title="For Instagram, private or age-restricted videos: Decant uses your session from this browser."
      >
        <span data-i18n="Cookies">Cookies</span>
        <select id="cookies-select">
          <option value="" data-i18n="None">None</option>
          <option value="chrome">Chrome</option>
          <option value="firefox">Firefox</option>
          <option value="safari" data-platform="darwin">Safari</option>
          <option value="edge">Edge</option>
          <option value="brave">Brave</option>
          <option value="opera">Opera</option>
          <option value="vivaldi">Vivaldi</option>
        </select>
      </label>
      <span class="spacer"></span>
      <span id="engine-version" class="muted"></span>
      <button id="engine-update" class="link" data-i18n="Update engine">Update engine</button>
    </footer>

    <script src="../../src/renderer/i18n.js"></script>
    <script src="mock.js"></script>
    <script src="../../src/renderer/app.js"></script>
  </body>
</html>

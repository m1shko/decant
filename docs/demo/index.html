<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Decant</title>
    <link rel="stylesheet" href="../../src/renderer/styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5 6h22l-8.5 11v7.5L13.5 27V17z" />
        </svg>
        <span>Decant</span>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="download" aria-selected="true">Download</button>
        <button role="tab" data-tab="library" aria-selected="false">Library <span id="library-count" class="count"></span></button>
        <button role="tab" data-tab="history" aria-selected="false">History <span id="history-count" class="count"></span></button>
      </nav>
    </header>

    <main>
      <section id="tab-download" class="tab">
        <form id="url-form" class="search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 14a3.5 3.5 0 0 0 5 0l4-4a3.5 3.5 0 0 0-5-5l-.5.5M14 10a3.5 3.5 0 0 0-5 0l-4 4a3.5 3.5 0 0 0 5 5l.5-.5" />
          </svg>
          <input
            id="url-input"
            type="text"
            spellcheck="false"
            placeholder="Paste a YouTube, Instagram, TikTok… link, or type to search"
            aria-label="Link or search"
          />
          <button type="submit" class="btn primary" id="analyze-btn">Go</button>
        </form>

        <div id="notice" class="notice" hidden></div>
        <div id="preview"></div>

        <div class="destination">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
          <span>Saving to</span>
          <button id="dest-path" class="path" title="Open the folder"></button>
          <button id="dest-change" class="btn small">Change</button>
        </div>

        <section class="queue">
          <div class="section-head">
            <h2>Queue</h2>
            <button id="queue-clear" class="link" hidden>Clear finished</button>
          </div>
          <ul id="queue-list" class="rows"></ul>
          <p id="queue-empty" class="empty">Nothing here yet. Paste a link to get started.</p>
        </section>
      </section>

      <section id="tab-library" class="tab wide" hidden>
        <div class="library-head">
          <div id="library-filter" class="segmented"></div>
          <input id="library-search" type="search" spellcheck="false" placeholder="Search your library" aria-label="Search your library" />
        </div>
        <ul id="library-grid" class="grid"></ul>
        <p id="library-empty" class="empty"></p>
        <p id="library-usage" class="hint"></p>
      </section>

      <section id="player" class="player" hidden></section>

      <section id="tab-history" class="tab" hidden>
        <div class="section-head">
          <h2>History</h2>
          <button id="history-clear" class="link">Clear all</button>
        </div>
        <ul id="history-list" class="rows"></ul>
        <p id="history-empty" class="empty">No downloads yet.</p>
      </section>
    </main>

    <div id="mini-player" class="mini" hidden></div>

    <footer class="statusbar">
      <label class="cookies" title="For Instagram, private or age-restricted videos: Decant uses your session from this browser.">
        Cookies
        <select id="cookies-select">
          <option value="">None</option>
          <option value="chrome">Chrome</option>
          <option value="firefox">Firefox</option>
          <option value="safari" data-platform="darwin">Safari</option>
          <option value="edge">Edge</option>
          <option value="brave">Brave</option>
          <option value="opera">Opera</option>
          <option value="vivaldi">Vivaldi</option>
        </select>
      </label>
      <span class="spacer"></span>
      <span id="engine-version" class="muted"></span>
      <button id="engine-update" class="link">Update engine</button>
    </footer>

    <script src="mock.js"></script>
    <script src="../../src/renderer/app.js"></script>
  </body>
</html>

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # postinstall downloads yt-dlp and copies ffmpeg/ffprobe for this OS into bin/
      - run: npm install

      - run: npm test

      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The bundled tools must run, and the app must open and stay up.
      - if: runner.os == 'Linux'
        run: |
          bin/yt-dlp --version
          bin/ffmpeg -version | head -1
          bin/ffprobe -version | head -1
          sudo apt-get install -y xvfb
          xvfb-run -a timeout 20 dist/linux-unpacked/decant --no-sandbox || [ $? -eq 124 ]

      - uses: actions/upload-artifact@v4
        with:
          name: decant-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
